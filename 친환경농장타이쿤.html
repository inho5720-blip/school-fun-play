<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>친환경 농장 타이쿤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 하늘 배경 위 한 화면에 한 단계. 위쪽 진행 표시, 가운데 뽑기 카드, 아래쪽 큰 결정 버튼. 귀여운 단일(밝은) 테마 */
:root {
  --sky: #DDF0FF;
  --sky-deep: #BFE2FF;
  --hill: #9BD67F;
  --hill-deep: #6FBE58;
  --card: #FFFFFF;
  --ink: #23331F;
  --ink-soft: #566552;
  --leaf: #3E9B3A;
  --leaf-soft: #E3F5DC;
  --sun: #FFC93C;
  --sun-soft: #FFF3CC;
  --berry: #FF6B6B;
  --berry-soft: #FFE6E3;
  --grape: #7A6FF0;
  --line: #D6E4CF;
  --font-display: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sky); }
.scenery { position: fixed; inset: auto 0 0 0; height: 150px; z-index: 0; pointer-events: none; }
.scenery svg { width: 100%; height: 100%; display: block; }
.cloud { position: fixed; z-index: 0; pointer-events: none; background: #FFFFFF; border-radius: 999px; opacity: .85; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #FFFFFF; border-radius: 50%; }
.c1 { width: 120px; height: 34px; top: 90px; left: -20px; animation: drift 60s linear infinite; }
.c1::before { width: 54px; height: 54px; left: 22px; top: -26px; } .c1::after { width: 40px; height: 40px; left: 64px; top: -16px; }
.c2 { width: 90px; height: 26px; top: 200px; right: 6%; animation: drift 80s linear infinite reverse; }
.c2::before { width: 40px; height: 40px; left: 16px; top: -20px; } .c2::after { width: 30px; height: 30px; left: 46px; top: -12px; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(40vw); } }

.app {
  position: relative; z-index: 1;
  max-width: 920px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 170px;
  display: flex; flex-direction: column; gap: 16px;
}

/* 상단 진행 */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sign {
  font-family: var(--font-display); font-size: 1.15rem; background: #A9744A; color: #FFFFFF;
  padding: 6px 16px; border-radius: 10px; box-shadow: 0 4px 0 #7D5232; position: relative; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.track { display: flex; gap: 6px; align-items: center; }
.dot {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: #FFFFFF; border: 3px solid var(--line); font-size: 1.1rem; transition: transform .25s, border-color .25s, background .25s;
}
.dot.now { border-color: var(--sun); background: var(--sun-soft); transform: scale(1.15); }
.dot.done { border-color: var(--leaf); background: var(--leaf-soft); }
.bar { width: 10px; height: 3px; background: var(--line); border-radius: 2px; }
@media (max-width: 480px) { .dot { width: 30px; height: 30px; font-size: .9rem; border-width: 2px; } .bar { width: 4px; } .sign { font-size: 1rem; } }

/* 단계 화면 */
.stage { display: flex; flex-direction: column; gap: 16px; animation: pop-in .35s ease-out; }
@keyframes pop-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.bubble {
  background: var(--card); border-radius: 22px; padding: 16px 20px; display: flex; gap: 14px; align-items: center;
  box-shadow: 0 6px 0 rgba(35, 51, 31, .08);
}
.bubble .face { font-size: 2.6rem; line-height: 1; flex: none; }
.bubble h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; line-height: 1.25; text-wrap: balance; }
.bubble p { margin: 2px 0 0; color: var(--ink-soft); font-size: .95rem; }

/* 뽑기 카드 */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
.pick {
  font: inherit; color: inherit; text-align: left; cursor: pointer;
  background: var(--card); border: 4px solid transparent; border-radius: 22px; padding: 16px;
  display: flex; flex-direction: column; gap: 8px; min-width: 0;
  box-shadow: 0 6px 0 rgba(35, 51, 31, .1); transition: transform .15s, border-color .15s, box-shadow .15s;
  min-height: 44px;
}
.pick:hover { transform: translateY(-2px); }
.pick:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(35, 51, 31, .1); }
.pick[aria-pressed="true"] { border-color: var(--sun); background: var(--sun-soft); box-shadow: 0 6px 0 #E6AE1F; }
.pick:disabled { cursor: default; }
.pick .emo { font-size: 3rem; line-height: 1.1; }
.pick .name { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.2; }
.pick .desc { font-size: .9rem; color: var(--ink-soft); }
.pick .row { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: .78rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--leaf-soft); color: #2C6E29; white-space: nowrap; }
.tag.sun { background: var(--sun-soft); color: #8A5A00; }
.tag.berry { background: var(--berry-soft); color: #B33A3A; }
.tag.grape { background: #ECEAFF; color: #4B42B8; }
.money { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: .88rem; font-variant-numeric: tabular-nums; }
.money span:nth-child(odd) { color: var(--ink-soft); }
.money b { font-weight: 700; }
@media (max-width: 640px) {
  .pick { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .pick .emo { font-size: 2.4rem; }
  .pick .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
}
.pick .body { display: flex; flex-direction: column; gap: 6px; }

/* 굴러가는 중 */
.rolling .pick { animation: jiggle .14s linear infinite; pointer-events: none; }
.rolling .pick .emo { filter: blur(.4px); }
@keyframes jiggle { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
.land { animation: land .45s cubic-bezier(.3,1.6,.5,1) !important; }
@keyframes land { 0% { transform: scale(.85); } 100% { transform: scale(1); } }

/* 위기 룰렛 */
.crisis-stage { display: grid; place-items: center; }
.crisis-card {
  width: min(380px, 100%); background: var(--card); border-radius: 26px; padding: 22px 20px; text-align: center;
  border: 5px solid var(--berry); box-shadow: 0 8px 0 #D94F4F; display: flex; flex-direction: column; gap: 6px; align-items: center;
}
.crisis-card .emo { font-size: 4.2rem; line-height: 1.1; }
.crisis-card .label { font-size: .8rem; font-weight: 700; color: #B33A3A; letter-spacing: .1em; }
.crisis-card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; line-height: 1.2; }
.crisis-card p { margin: 0; color: var(--ink-soft); }
.crisis-card.spin { animation: wobble .18s linear infinite; }
@keyframes wobble { 0%,100% { transform: rotate(-3deg) scale(.98); } 50% { transform: rotate(3deg) scale(1.02); } }
.crisis-card.hit { animation: hit .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes hit { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* 버튼 */
.actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.btn {
  font: inherit; font-family: var(--font-display); font-size: 1.3rem; border: none; cursor: pointer;
  background: var(--leaf); color: #FFFFFF; border-radius: 18px; padding: 14px 30px; min-height: 56px;
  box-shadow: 0 6px 0 #2B7428; transition: transform .1s, box-shadow .1s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2B7428; }
.btn:disabled { background: #B9C7B3; box-shadow: 0 6px 0 #9AAA94; cursor: not-allowed; }
.btn.sun { background: var(--sun); color: var(--ink); box-shadow: 0 6px 0 #D9A21C; }
.btn.sun:active { box-shadow: 0 2px 0 #D9A21C; }
.btn.ghost { background: #FFFFFF; color: var(--leaf); box-shadow: 0 6px 0 #C9D9C2; }
.btn:focus-visible, .pick:focus-visible, input:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }

/* 시작 화면 */
.title-card { background: var(--card); border-radius: 28px; padding: 26px 22px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; box-shadow: 0 8px 0 rgba(35, 51, 31, .1); }
.title-card .logo { font-size: 3.6rem; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.title-card h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.1; color: var(--leaf); }
.title-card .sub { margin: 0; color: var(--ink-soft); max-width: 34em; }
.name-input { width: min(360px, 100%); display: flex; flex-direction: column; gap: 6px; text-align: left; }
.name-input label { font-weight: 700; font-size: .95rem; }
.name-input input {
  font: inherit; font-family: var(--font-display); font-size: 1.4rem; text-align: center;
  border: 4px solid var(--line); border-radius: 16px; padding: 10px 14px; width: 100%; color: var(--ink); background: #FBFFF8;
}
.name-input input:focus { border-color: var(--sun); outline: none; }
.how { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; width: 100%; }
.how div { background: var(--leaf-soft); border-radius: 14px; padding: 10px 4px; font-size: .78rem; font-weight: 700; color: #2C6E29; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.how div span { font-size: 1.6rem; }
@media (max-width: 480px) { .how { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* 결과 */
.result { background: var(--card); border-radius: 28px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 0 rgba(35, 51, 31, .1); }
.grade { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.grade .medal { font-size: 4.4rem; line-height: 1; animation: hit .8s cubic-bezier(.3,1.6,.5,1); }
.grade .gname { font-family: var(--font-display); font-size: 2rem; line-height: 1.2; }
.grade .farm { color: var(--ink-soft); font-size: .95rem; }
.profit { text-align: center; background: var(--sun-soft); border-radius: 20px; padding: 14px; }
.profit .lbl { font-weight: 700; color: #8A5A00; font-size: .9rem; }
.profit .num { font-family: var(--font-display); font-size: clamp(2.2rem, 9vw, 3.2rem); line-height: 1.1; font-variant-numeric: tabular-nums; }
.profit .num.minus { color: #C83C3C; }
.profit .cmp { font-size: .88rem; color: var(--ink-soft); }
.ledger { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .ledger { grid-template-columns: 1fr; } }
.ledger section { border: 3px solid var(--line); border-radius: 18px; padding: 12px 14px; min-width: 0; }
.ledger h3 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.ledger .in h3 { color: var(--leaf); } .ledger .out h3 { color: #C83C3C; }
.ledger ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ledger li { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.ledger li span:first-child { color: var(--ink-soft); min-width: 0; }
.ledger li b { white-space: nowrap; }
.ledger .sum { border-top: 2px dashed var(--line); padding-top: 6px; margin-top: 2px; font-weight: 700; }
.ledger .sum span:first-child { color: var(--ink); }
.notes { display: grid; gap: 8px; }
.note { display: flex; gap: 10px; align-items: flex-start; background: #F6FAF3; border-radius: 14px; padding: 10px 12px; font-size: .93rem; }
.note .ic { font-size: 1.4rem; line-height: 1.2; flex: none; }
.note b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; }
.note.good { background: var(--leaf-soft); } .note.bad { background: var(--berry-soft); } .note.mid { background: var(--sun-soft); }
.eco { display: flex; justify-content: center; gap: 4px; font-size: 1.6rem; }
.eco .off { filter: grayscale(1); opacity: .3; }
.hall { background: var(--card); border-radius: 22px; padding: 14px 16px; display: grid; gap: 6px; }
.hall h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.hall ol { margin: 0; padding-left: 1.3em; display: grid; gap: 2px; font-size: .92rem; font-variant-numeric: tabular-nums; }
.hall .empty { color: var(--ink-soft); font-size: .9rem; }
.tip { text-align: center; font-size: .85rem; color: var(--ink-soft); }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.confetti i { position: absolute; top: -20px; font-style: normal; font-size: 1.6rem; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="cloud c1" aria-hidden="true"></div>
<div class="cloud c2" aria-hidden="true"></div>
<div class="scenery" aria-hidden="true">
  <svg viewBox="0 0 1200 150" preserveAspectRatio="none">
    <path d="M0 70 C 200 20, 380 40, 560 70 S 900 20, 1200 60 L1200 150 L0 150 Z" fill="#9BD67F"></path>
    <path d="M0 105 C 260 70, 520 90, 760 110 S 1060 80, 1200 100 L1200 150 L0 150 Z" fill="#6FBE58"></path>
    <g fill="#4E9A3E">
      <rect x="120" y="118" width="3" height="16"></rect><rect x="140" y="114" width="3" height="20"></rect><rect x="160" y="118" width="3" height="16"></rect>
      <rect x="980" y="112" width="3" height="20"></rect><rect x="1000" y="116" width="3" height="16"></rect><rect x="1020" y="112" width="3" height="20"></rect>
    </g>
  </svg>
</div>

<main class="app" id="app">
  <div class="hud" id="hud" hidden>
    <div class="sign" id="farmSign">농장</div>
    <div class="track" id="track" aria-label="진행 단계"></div>
  </div>
  <div id="screen"></div>
</main>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  /* ================= 게임 데이터 =================
     금액 단위: 만 원 (1년 농사 기준, 실제 농가 자료를 참고해 단순하게 만든 숫자)
     type: paddy(논) field(밭) greenhouse(하우스) orchard(과수원)               */
  const CROPS = [
    { id: "rice", e: "🌾", name: "쌀", type: "paddy", rev: 1100, cost: 650, vol: 0.08, work: 1, note: "정부가 사 주는 제도가 있어 값이 안정적이지만 버는 돈은 적은 편이에요." },
    { id: "potato", e: "🥔", name: "감자", type: "field", rev: 1500, cost: 850, vol: 0.25, work: 1, note: "키우기 쉬운 편이지만 해마다 값이 많이 달라져요." },
    { id: "sweetpotato", e: "🍠", name: "고구마", type: "field", rev: 1800, cost: 950, vol: 0.2, work: 2, note: "간식과 가공품으로 인기가 많아요." },
    { id: "cabbage", e: "🥬", name: "배추", type: "field", rev: 1600, cost: 900, vol: 0.4, work: 2, note: "김장철 값이 크게 오르내려요. 대박 아니면 쪽박!" },
    { id: "lettuce", e: "🥗", name: "상추", type: "field", rev: 1400, cost: 800, vol: 0.3, work: 2, note: "빨리 자라서 여러 번 거둘 수 있지만 여름에 쉽게 물러요." },
    { id: "pepper", e: "🌶️", name: "고추", type: "field", rev: 2400, cost: 1500, vol: 0.3, work: 3, note: "값은 좋지만 탄저병 같은 병에 약해 손이 많이 가요." },
    { id: "bean", e: "🫘", name: "콩", type: "field", rev: 1000, cost: 450, vol: 0.15, work: 1, note: "뿌리의 뿌리혹박테리아가 땅을 기름지게 해 줘요." },
    { id: "strawberry", e: "🍓", name: "딸기", type: "greenhouse", rev: 4500, cost: 2800, vol: 0.2, work: 3, note: "버는 돈이 크지만 시설비와 일손이 아주 많이 들어요." },
    { id: "tomato", e: "🍅", name: "토마토", type: "greenhouse", rev: 3600, cost: 2200, vol: 0.25, work: 3, note: "하우스에서 오래 수확해요. 꿀벌이 꽃가루받이를 도와요." },
    { id: "blueberry", e: "🫐", name: "블루베리", type: "orchard", rev: 2500, cost: 1200, vol: 0.2, work: 2, note: "인기 많은 과일이지만 새들이 열매를 노려요." },
    { id: "apple", e: "🍎", name: "사과", type: "orchard", rev: 3000, cost: 1700, vol: 0.2, work: 3, note: "태풍과 탄저병을 조심해야 하는 과일이에요." }
  ];
  const PLACE = { paddy: "논", field: "밭", greenhouse: "비닐하우스", orchard: "과수원" };
  const PRODUCT = { rice: "떡", potato: "감자칩", sweetpotato: "고구마말랭이", cabbage: "김치", lettuce: "샐러드", pepper: "고춧가루", bean: "두부", strawberry: "딸기잼", tomato: "토마토주스", blueberry: "블루베리잼", apple: "사과즙" };
  const ALL = ["paddy", "field", "greenhouse", "orchard"];

  const METHODS = [
    { id: "snail", e: "🐌", name: "우렁이 농법", fits: ["paddy"], cost: 40, y: 1.0, desc: "우렁이가 논의 잡초를 먹어 치워요.", miss: "우렁이는 물이 고인 논에서만 일할 수 있어요!" },
    { id: "duck", e: "🦆", name: "오리 농법", fits: ["paddy"], cost: 60, y: 1.0, extra: 40, desc: "오리가 잡초와 벌레를 먹고, 똥은 거름이 돼요.", miss: "논이 아닌 곳에서는 오리가 작물을 밟고 다녀요!" },
    { id: "ricebran", e: "🍚", name: "쌀겨 농법", fits: ["paddy"], cost: 25, y: 0.97, desc: "쌀겨를 뿌려 물속 잡초가 자라지 못하게 해요.", miss: "쌀겨 농법은 물을 댄 논에서 효과가 있어요." },
    { id: "ladybug", e: "🐞", name: "천적 곤충", fits: ["greenhouse", "field", "orchard"], cost: 50, y: 1.0, desc: "무당벌레 같은 천적이 해충을 잡아먹어요.", miss: "물이 찬 논에서는 천적 곤충이 살기 어려워요." },

  }

  /* ---------- 공통: 3장 뽑기 ---------- */
  async function pickStep({ face, title, sub, pool, chosen, render, onPick, button }) {
    hud();
    $screen.innerHTML =
      '<div class="stage">' +
        '<div class="bubble"><div class="face">' + face + '</div><div><h2>' + title + '</h2><p>' + sub + '</p></div></div>' +
        '<div class="cards rolling" id="cards">' + chosen.map(() => '<button class="pick" type="button" disabled></button>').join("") + '</div>' +
        '<div class="actions"><button class="btn" type="button" id="go" disabled>' + button + '</button></div>' +
      '</div>';
    const wrap = document.getElementById("cards");
    const btns = Array.from(wrap.children);
    // 굴리기 애니메이션
    let stopped = btns.map(() => false);
    const tick = setInterval(() => {
      btns.forEach((b, i) => { if (!stopped[i]) b.innerHTML = render(pool[Math.floor(Math.random() * pool.length)], true); });
    }, 80);
    if (reduce()) { /* 바로 공개 */ }
    for (let i = 0; i < btns.length; i++) {
      await sleep(i === 0 ? 900 : 350);
      stopped[i] = true;
      btns[i].innerHTML = render(chosen[i], false);
      btns[i].classList.add("land");
    }
    clearInterval(tick);
    wrap.classList.remove("rolling");
    let sel = -1;
    btns.forEach((b, i) => {
      b.disabled = false; b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", () => {
        sel = i; btns.forEach((x, j) => x.setAttribute("aria-pressed", j === i ? "true" : "false"));
        document.getElementById("go").disabled = false;
      });
    });
    document.getElementById("go").addEventListener("click", () => { if (sel >= 0) onPick(chosen[sel]); });
  }

  /* ---------- 1. 작물 ---------- */
  function cropStep() {
    S.step = 0;
    const chosen = shuffle(CROPS).slice(0, 3);
    pickStep({
      face: "🧑‍🌾", title: "어떤 작물을 길러 볼까요?", sub: "세 가지 작물이 나왔어요. 버는 돈과 드는 돈, 특징을 비교해 보세요.",
      pool: CROPS, chosen, button: "이 작물로 결정!",
      render: (c, rolling) => '<div class="emo">' + c.e + '</div><div class="body"><div class="name">' + esc(c.name) + '</div>' +
        (rolling ? "" :
        '<div class="row"><span class="tag">' + PLACE[c.type] + '</span><span class="tag sun">일손 ' + "💪".repeat(c.work) + '</span>' + (c.vol >= 0.3 ? '<span class="tag berry">값 변동 큼</span>' : c.vol <= 0.1 ? '<span class="tag grape">값 안정</span>' : "") + '</div>' +
        '<div class="money"><span>예상 판매액</span><b>' + won(c.rev) + '</b><span>드는 돈</span><b>' + won(c.cost) + '</b></div>' +
        '<div class="desc">' + esc(c.note) + '</div>') + '</div>',
      onPick: c => { S.crop = c; methodStep(); }
    });
  }

  /* ---------- 2. 농법 ---------- */
  function methodStep() {
    S.step = 1;
    let chosen = shuffle(METHODS).slice(0, 3);
    const fits = m => m.fits.includes(S.crop.type);
    if (!chosen.some(fits)) {
      const good = shuffle(METHODS.filter(m => fits(m) && !chosen.includes(m)))[0];
      chosen[Math.floor(Math.random() * 3)] = good;
    }
    pickStep({
      face: S.crop.e, title: josa(S.crop.name, "을/를") + " 어떤 친환경 방법으로 기를까요?", sub: "우리 작물이 자라는 곳(" + PLACE[S.crop.type] + ")에 잘 맞는 방법을 골라야 해요.",
      pool: METHODS, chosen, button: "이 방법으로 결정!",
      render: (m, rolling) => '<div class="emo">' + m.e + '</div><div class="body"><div class="name">' + esc(m.name) + '</div>' +
        (rolling ? "" :
        '<div class="row"><span class="tag sun">준비 비용 ' + won(m.cost) + '</span></div>' +
        '<div class="desc">' + esc(m.desc) + '</div>') + '</div>',
      onPick: m => { S.method = m; crisisStep(); }
    });
  }

  /* ---------- 3. 위기 ---------- */
  async function crisisStep() {
    S.step = 2; hud();
    const pool = CRISES.filter(c => !c.when || c.when(S));
    const crisis = pool[Math.floor(Math.random() * pool.length)];
    $screen.innerHTML =
      '<div class="stage">' +
        '<div class="bubble"><div class="face">😰</div><div><h2>농사를 짓다 보니 위기가 찾아왔어요!</h2><p>어떤 위기일까요? 두근두근...</p></div></div>' +
        '<div class="crisis-stage"><div class="crisis-card spin" id="cc"><div class="emo" id="ce">❓</div><div class="label">위기 발생</div><h3 id="cn">두근두근</h3><p id="ct"></p></div></div>' +
        '<div id="solArea"></div>' +
      '</div>';
    const ce = document.getElementById("ce"), cn = document.getElementById("cn");
    let delay = 60;
    if (!reduce()) {
      for (let i = 0; i < 18; i++) {
        const c = CRISES[i % CRISES.length];
        ce.textContent = c.e; cn.textContent = c.name;
        await sleep(delay); delay *= 1.15;
      }
    }
    const cc = document.getElementById("cc");
    cc.classList.remove("spin"); cc.classList.add("hit");
    ce.textContent = crisis.e; cn.textContent = crisis.name; document.getElementById("ct").textContent = crisis.text;
    S.crisis = crisis;
    await sleep(900);

    let sols = crisis.sols.filter(s => !s.when || s.when(S));
    const good = shuffle(sols.filter(s => s.q === "good"));
    const notGood = shuffle(sols.filter(s => s.q !== "good"));
    let chosen = [good[0], notGood[0]];
    const rest = shuffle(sols.filter(s => !chosen.includes(s)));
    chosen.push(rest[0]);
    chosen = shuffle(chosen.filter(Boolean)).slice(0, 3);

    const area = document.getElementById("solArea");
    area.innerHTML = '<div class="bubble" style="margin-bottom:14px"><div class="face">🤔</div><div><h2>어떻게 해결할까요?</h2><p>친환경 농장답게, 그리고 피해는 적게! 가장 좋은 방법을 골라 보세요.</p></div></div>' +
      '<div class="cards rolling" id="cards">' + chosen.map(() => '<button class="pick" type="button" disabled></button>').join("") + '</div>' +
      '<div class="actions" style="margin-top:16px"><button class="btn" type="button" id="go" disabled>이렇게 해결하기!</button></div>';
    area.scrollIntoView({ behavior: reduce() ? "auto" : "smooth", block: "start" });

    const allSols = CRISES.flatMap(c => c.sols);
    const render = (s, rolling) => '<div class="emo">' + s.e + '</div><div class="body"><div class="name">' + esc(s.t) + '</div>' +
      (rolling ? "" : '<div class="row"><span class="tag sun">비용 ' + won(s.cost) + '</span></div>') + '</div>';
    const wrap = document.getElementById("cards"); const btns = Array.from(wrap.children);
    const stopped = btns.map(() => false);
    const tick = setInterval(() => btns.forEach((b, i) => { if (!stopped[i]) b.innerHTML = render(allSols[Math.floor(Math.random() * allSols.length)], true); }), 80);
    for (let i = 0; i < btns.length; i++) { await sleep(i === 0 ? 700 : 300); stopped[i] = true; btns[i].innerHTML = render(chosen[i], false); btns[i].classList.add("land"); }
    clearInterval(tick); wrap.classList.remove("rolling");
    let sel = -1;
    btns.forEach((b, i) => { b.disabled = false; b.setAttribute("aria-pressed", "false"); b.addEventListener("click", () => { sel = i; btns.forEach((x, j) => x.setAttribute("aria-pressed", j === i ? "true" : "false")); document.getElementById("go").disabled = false; }); });
    document.getElementById("go").addEventListener("click", () => { if (sel >= 0) { S.solution = chosen[sel]; salesStep(); } });
  }

  const salesCost = s => s.costRate ? Math.round(S.crop.rev * s.costRate / 10) * 10 : s.cost;

  /* ---------- 4. 판매 ---------- */
  function salesStep() {
    S.step = 3;
    const chosen = shuffle(SALES).slice(0, 3);
    const product = PRODUCT[S.crop.id];
    pickStep({
      face: "💰", title: "다 키운 " + josa(S.crop.name, "을/를") + " 어떻게 팔까요?", sub: "판매 방법에 따라 받는 값과 드는 비용이 달라요.",
      pool: SALES, chosen, button: "이렇게 팔기!",
      render: (s, rolling) => {
        const d = s.desc.replace("{product}", product);
        let tags = '<span class="tag sun">비용 ' + won(salesCost(s)) + '</span>';
        if (s.stable) tags += '<span class="tag grape">값 안정</span>';
        if (s.extra) tags += '<span class="tag">체험비 수입</span>';
        return '<div class="emo">' + s.e + '</div><div class="body"><div class="name">' + esc(s.name) + '</div>' +
          (rolling ? "" : '<div class="row">' + tags + '</div><div class="desc">' + esc(d) + '</div>') + '</div>';
      },
      onPick: s => { S.sales = s; resultStep(); }
    });
  }

  /* ---------- 5. 계산 ---------- */
  function compute() {
    const c = S.crop, m = S.method, sol = S.solution, sa = S.sales;
    const fit = m.fits.includes(c.type);
    const certLost = sol.q === "chem";
    const methodY = fit ? m.y : 0.85;
    const ecoY = 0.9; // 친환경 농업은 수확량이 조금 줄어요
    const v = c.vol * (sa.stable ? 0.4 : 1);
    const market = Math.round((1 + (Math.random() * 2 - 1) * v) * 100) / 100;

    let price = sa.price;
    if (sa.id === "process" && c.id === "lettuce") price = 1.05;
    if (certLost) price = Math.max(0.85, price * 0.8);

    const harvest = c.rev * ecoY * methodY * (1 - sol.loss);
    const cropSales = harvest * price * market;
    const income = [["농산물 판매", cropSales]];
    if (m.extra && fit) income.push(["다 자란 오리 판매", m.extra]);
    if (sa.extra) {
      const tourFit = sa.fits.includes(c.id);
      income.push(["체험비 수입", tourFit ? sa.extra : 80]);
    }
    const spend = [["기본 농사 비용(종자·퇴비·인건비)", c.cost], [m.name + " 준비", m.cost], ["위기 대응: " + sol.t, sol.cost], [sa.name + " 비용", salesCost(sa)]].filter(x => x[1] > 0);
    const inSum = income.reduce((a, x) => a + x[1], 0);
    const outSum = spend.reduce((a, x) => a + x[1], 0);
    const profit = Math.round(inSum - outSum);
    const bench = c.rev - c.cost;
    const ratio = profit / bench;
    let grade = GRADES.find(g => ratio >= g.min);
    if (certLost && grade === GRADES[0]) grade = GRADES[1];

    const eco = (fit ? 1 : 0) + (sol.q === "good" ? 1 : 0) + (certLost ? 0 : 1);

    const notes = [];
    notes.push(fit
      ? { k: "good", ic: m.e, h: "농법이 잘 맞았어요", t: josa(m.name, "은/는") + " " + PLACE[c.type] + "에서 기르는 " + c.name + "에 딱 맞았어요. " + m.desc }
      : { k: "bad", ic: m.e, h: "농법이 잘 안 맞았어요", t: m.miss || "우리 작물과 잘 맞지 않아 효과가 적었어요." });
    const qMap = { good: ["good", "위기 대응 성공!"], ok: ["mid", "조금 아쉬운 대응"], bad: ["bad", "위기 대응 실패"], chem: ["bad", "친환경 인증 취소!"] };
    notes.push({ k: qMap[sol.q][0], ic: sol.e, h: qMap[sol.q][1] + " (" + S.crisis.name + ")", t: sol.t + ": " + sol.why + " 피해율 " + Math.round(sol.loss * 100) + "%" });
    const saleNote = sa.desc.replace("{product}", PRODUCT[c.id]);
    notes.push({ k: price >= 1.2 ? "good" : price >= 1 ? "mid" : "bad", ic: sa.e, h: sa.name, t: saleNote + (certLost ? " 하지만 친환경 인증이 취소되어 제값을 받지 못했어요." : "") + (sa.extra && !sa.fits.includes(c.id) ? " " + josa(c.name, "은/는") + " 체험 활동으로는 인기가 적었어요." : "") });
    const pct = Math.round((market - 1) * 100);
    notes.push({ k: pct >= 0 ? "good" : "mid", ic: pct >= 0 ? "📈" : "📉", h: "올해 " + c.name + " 시세", t: pct === 0 ? "평년과 비슷했어요." : "평년보다 " + Math.abs(pct) + "% " + (pct > 0 ? "올랐어요! 운이 좋았네요." : "떨어졌어요.") + (sa.stable ? " 미리 약속한 값에 팔아서 영향이 적었어요." : "") });

    return { income, spend, inSum, outSum, profit, bench, ratio, grade, eco, notes, certLost };
  }

  /* ---------- 6. 결과 ---------- */
  function resultStep() {
    S.step = 4; hud();
    const r = compute();
    saveRecord(r);
    const cmp = r.ratio >= 1 ? "보통 " + S.crop.name + " 농가(" + won(r.bench) + ")보다 " + Math.round((r.ratio - 1) * 100) + "% 더 벌었어요!" :
      "보통 " + S.crop.name + " 농가는 " + won(r.bench) + " 정도 벌어요.";
    $screen.innerHTML =
      '<div class="stage"><div class="result">' +
        '<div class="grade"><div class="medal">' + r.grade.e + '</div><div class="gname">' + r.grade.name + '</div>' +
          '<div class="farm">' + esc(S.farm) + ' · ' + S.crop.e + ' ' + esc(S.crop.name) + ' · ' + S.method.e + ' ' + esc(S.method.name) + ' · ' + S.sales.e + ' ' + esc(S.sales.name) + '</div>' +
          '<div>' + r.grade.msg + '</div></div>' +
        '<div class="profit"><div class="lbl">1년 순이익</div><div class="num' + (r.profit < 0 ? " minus" : "") + '" id="pnum">0만 원</div><div class="cmp">' + cmp + '</div></div>' +
        '<div><div class="tip" style="margin-bottom:2px">친환경 점수</div><div class="eco">' + [0, 1, 2].map(i => '<span class="' + (i < r.eco ? "" : "off") + '">🍀</span>').join("") + '</div></div>' +
        '<div class="ledger">' +
          '<section class="in"><h3>번 돈 (수입)</h3><ul>' + r.income.map(x => '<li><span>' + esc(x[0]) + '</span><b>' + won(x[1]) + '</b></li>').join("") +
            '<li class="sum"><span>합계</span><b>' + won(r.inSum) + '</b></li></ul></section>' +
          '<section class="out"><h3>쓴 돈 (지출)</h3><ul>' + r.spend.map(x => '<li><span>' + esc(x[0]) + '</span><b>' + won(x[1]) + '</b></li>').join("") +
            '<li class="sum"><span>합계</span><b>' + won(r.outSum) + '</b></li></ul></section>' +
        '</div>' +
        '<div class="notes">' + r.notes.map(n => '<div class="note ' + n.k + '"><span class="ic">' + n.ic + '</span><div><b>' + esc(n.h) + '</b>' + esc(n.t) + '</div></div>').join("") + '</div>' +
        '<div class="actions"><button class="btn sun" type="button" id="again">같은 농장으로 다시 도전</button><button class="btn ghost" type="button" id="home">처음 화면으로</button></div>' +
        '<div class="tip">결과 화면을 캡처해서 발표할 때 활용해 보세요. 같은 선택이어도 시세에 따라 결과가 조금씩 달라져요.</div>' +
      '</div></div>' + hallHTML();
    countUp(document.getElementById("pnum"), r.profit);
    if (r.grade === GRADES[0]) confetti();
    document.getElementById("again").addEventListener("click", () => { const f = S.farm; newGame(f); cropStep(); });
    document.getElementById("home").addEventListener("click", startScreen);
    window.scrollTo({ top: 0, behavior: reduce() ? "auto" : "smooth" });
  }
  function countUp(el, to) {
    if (reduce()) { el.textContent = won(to); return; }
    const t0 = performance.now(), dur = 1400;
    (function f(t) {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = won(to * e);
      if (p < 1) requestAnimationFrame(f);
    })(t0);
  }
  function confetti() {
    if (reduce()) return;
    const box = document.getElementById("confetti"); box.innerHTML = "";
    const items = ["🍀", "⭐", "🌸", "💰", S.crop.e];
    for (let i = 0; i < 28; i++) {
      const s = document.createElement("i");
      s.textContent = items[i % items.length];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDuration = 2 + Math.random() * 2 + "s";
      s.style.animationDelay = Math.random() * 0.8 + "s";
      box.appendChild(s);
    }
    setTimeout(() => box.innerHTML = "", 5000);
  }

  /* ---------- 이 기기 명예의 전당 ---------- */
  const KEY = "eco-farm-tycoon-hall";
  function readHall() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } }
  function saveRecord(r) {
    try {
      const h = readHall();
      h.push({ farm: S.farm, crop: S.crop.e + " " + S.crop.name, profit: r.profit, grade: r.grade.e });
      h.sort((a, b) => b.profit - a.profit);
      localStorage.setItem(KEY, JSON.stringify(h.slice(0, 5)));
    } catch (e) {}
  }
  function hallHTML() {
    const h = readHall();
    return '<div class="hall" style="margin-top:16px"><h3>🏅 이 기기 명예의 전당</h3>' +
      (h.length ? '<ol>' + h.map(x => '<li>' + x.grade + ' <b>' + esc(x.farm) + '</b> · ' + esc(x.crop) + ' · ' + won(x.profit) + '</li>').join("") + '</ol>'
        : '<div class="empty">아직 기록이 없어요. 첫 번째 농장 주인이 되어 보세요!</div>') + '</div>';
  }

  startScreen();
})();
</script>
</body>
</html>
